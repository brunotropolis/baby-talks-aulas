<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#E91E63">
<title>O Dia do Parto — Curso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Poppins', system-ui, -apple-system, sans-serif;
    background: #0F0F12;
    color: #fff;
    min-height: 100vh;
    line-height: 1.5;
  }
  .topbar {
    background: linear-gradient(135deg, #E91E63 0%, #C2185B 100%);
    padding: 32px 20px 28px;
    text-align: center;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .topbar::before {
    content: '';
    position: absolute;
    top: -50%; left: -10%;
    width: 120%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,.08) 0%, transparent 60%);
    pointer-events: none;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 3px;
    font-weight: 600;
    text-transform: uppercase;
    padding: 6px 14px;
    background: rgba(255,255,255,.15);
    backdrop-filter: blur(10px);
    border-radius: 999px;
    margin-bottom: 14px;
    position: relative;
  }
  .topbar h1 {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
    position: relative;
    letter-spacing: -.5px;
  }
  .topbar p {
    font-size: 14px;
    opacity: .9;
    position: relative;
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  .access-info {
    background: linear-gradient(135deg, #1a1a1f 0%, #2a1a25 100%);
    border: 1px solid rgba(233, 30, 99, .2);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13px;
  }
  .access-info .icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(233, 30, 99, .15);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 18px;
  }
  .access-info .label { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .access-info .value { color: #fff; font-weight: 500; font-size: 14px; }
  .countdown {
    text-align: center;
    padding: 4px 14px;
    border-left: 1px solid rgba(255,255,255,.08);
    margin-left: 6px;
  }
  .countdown-num {
    font-size: 24px;
    font-weight: 700;
    color: #E91E63;
    line-height: 1;
  }
  .countdown-label {
    font-size: 10px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }
  .countdown.warning .countdown-num { color: #FFB74D; }
  .countdown.urgent .countdown-num { color: #FF6B6B; }
  /* Página "Saiu do ar" */
  .offline-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
    background: #0F0F12;
    color: #fff;
  }
  .offline-screen .icon-big {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: linear-gradient(135deg, #E91E63, #C2185B);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    margin-bottom: 24px;
    box-shadow: 0 8px 32px rgba(233, 30, 99, .3);
  }
  .offline-screen h1 {
    font-size: 28px;
    margin-bottom: 12px;
    font-weight: 700;
    color: #fff;
  }
  .offline-screen p {
    color: #aaa;
    font-size: 16px;
    max-width: 460px;
    margin-bottom: 8px;
    line-height: 1.6;
  }
  .offline-screen .info-line {
    color: #777;
    font-size: 13px;
    margin-top: 24px;
    margin-bottom: 32px;
  }
  .offline-screen .btn-cta {
    background: linear-gradient(135deg, #E91E63, #F06292);
    color: #fff;
    text-decoration: none;
    padding: 14px 32px;
    border-radius: 14px;
    font-weight: 600;
    box-shadow: 0 4px 16px rgba(233, 30, 99, .3);
    transition: all .2s;
    display: inline-block;
  }
  .offline-screen .btn-cta:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(233, 30, 99, .4); }
  .offline-screen .footer-mini {
    margin-top: 48px;
    color: #555;
    font-size: 12px;
  }
  .section-title {
    font-size: 13px;
    color: #999;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 16px;
    padding-left: 4px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 14px; } }
  @media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
  @media (min-width: 1200px) { .grid { grid-template-columns: repeat(6, 1fr); } }
  .card {
    cursor: pointer;
    border-radius: 14px;
    overflow: hidden;
    background: #1a1a1f;
    transition: transform .25s, box-shadow .25s;
    position: relative;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(233, 30, 99, .2);
  }
  .card .thumb {
    width: 100%;
    aspect-ratio: 600 / 1050;
    background-size: cover;
    background-position: center;
    background-color: #2a1a25;
    position: relative;
  }
  .card .play {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(.9);
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(255,255,255,.95);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: all .25s;
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
  }
  .card:hover .play { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .card .play::after {
    content: '';
    width: 0; height: 0;
    border-left: 14px solid #E91E63;
    border-top: 9px solid transparent;
    border-bottom: 9px solid transparent;
    margin-left: 4px;
  }
  .card .info {
    padding: 10px 12px 14px;
  }
  .card .num {
    font-size: 10px;
    color: #E91E63;
    font-weight: 600;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
  }
  .card .title {
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    line-height: 1.3;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  /* MODAL PLAYER */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    flex-direction: column;
  }
  .modal.show { display: flex; animation: fadeIn .25s ease; }
  .modal-close {
    position: absolute;
    top: 16px; right: 20px;
    width: 44px; height: 44px;
    border: none;
    background: rgba(255,255,255,.1);
    color: #fff;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
    z-index: 10;
    transition: background .2s;
  }
  .modal-close:hover { background: rgba(255,255,255,.2); }
  .modal-content {
    width: 100%;
    max-width: 1000px;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .modal-content iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
  .modal-title {
    color: #fff;
    margin-top: 18px;
    font-size: 18px;
    font-weight: 500;
    text-align: center;
    max-width: 600px;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .footer {
    text-align: center;
    color: #555;
    font-size: 12px;
    padding: 32px 16px 16px;
  }
  /* LOADING/ERROR */
  .splash {
    position: fixed;
    inset: 0;
    background: #0F0F12;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    z-index: 999;
    padding: 24px;
    text-align: center;
  }
  .splash.hide { display: none; }
  .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(233, 30, 99, .2);
    border-top-color: #E91E63;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .splash-text { color: #999; font-size: 14px; }
  .splash-error { max-width: 400px; }
  .splash-error h2 { color: #fff; font-size: 20px; margin-bottom: 8px; }
  .splash-error p { color: #999; font-size: 14px; margin-bottom: 20px; }
  .splash-error .btn-link {
    color: #E91E63;
    text-decoration: none;
    font-weight: 500;
    border: 2px solid #E91E63;
    padding: 10px 22px;
    border-radius: 10px;
    display: inline-block;
    transition: all .2s;
  }
  .splash-error .btn-link:hover {
    background: #E91E63;
    color: #fff;
  }
  @media (max-width: 480px) {
    .topbar { padding: 24px 16px 22px; }
    .topbar h1 { font-size: 24px; }
    .access-info { flex-direction: row; padding: 12px 14px; }
    .access-info .icon { width: 32px; height: 32px; font-size: 15px; }
  }
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="spinner"></div>
  <div class="splash-text">Validando seu acesso...</div>
</div>

<div class="topbar">
  <div class="badge">Curso completo</div>
  <h1>O Dia do Parto</h1>
  <p>Preparando você para o momento mais especial 💕</p>
</div>

<div class="container">

  <div class="access-info">
    <div class="icon">⏰</div>
    <div style="flex:1">
      <div class="label">Seu acesso é válido até</div>
      <div class="value" id="expiresAt">—</div>
    </div>
    <div class="countdown" id="countdown" style="display:none">
      <div class="countdown-num" id="countdownNum">—</div>
      <div class="countdown-label" id="countdownLabel">dias restantes</div>
    </div>
  </div>

  <div class="section-title" id="sectionTitle">11 aulas · O Dia do Parto</div>

  <div class="grid" id="grid"></div>

</div>

<div class="footer">
  Manual do Recém-nascido · Acesso pessoal e intransferível
</div>

<div class="modal" id="modal">
  <button class="modal-close" onclick="closeModal()">×</button>
  <div class="modal-content"><iframe id="player" allow="fullscreen; encrypted-media" allowfullscreen></iframe></div>
  <div class="modal-title" id="modalTitle"></div>
</div>

<script>
  const VALIDATE_URL = 'https://n8n-n8n.xktssy.easypanel.host/webhook/baby-talks-validar';

  // FALLBACK / MOCK — usado em preview sem token (sem panda_url).
  // Em produção, lista vem do webhook com URLs Panda válidas.
  const MOCK_AULAS = [
    { num: 1, titulo: 'Boas-vindas', thumb: 'thumbs/1.png', panda: '' },
    { num: 2, titulo: 'O que levar para a maternidade', thumb: 'thumbs/2.png', panda: '' },
    { num: 3, titulo: 'Mala da mãe e do acompanhante', thumb: 'thumbs/3.png', panda: '' },
    { num: 4, titulo: 'Plano de parto', thumb: 'thumbs/4.png', panda: '' },
    { num: 5, titulo: 'Chegada à maternidade', thumb: 'thumbs/5.png', panda: '' },
    { num: 6, titulo: 'Parto normal', thumb: 'thumbs/6.png', panda: '' },
    { num: 7, titulo: 'Parto cesárea', thumb: 'thumbs/7.png', panda: '' },
    { num: 8, titulo: 'Golden hour', thumb: 'thumbs/8.png', panda: '' },
    { num: 9, titulo: 'Fotos e visitas', thumb: 'thumbs/9.png', panda: '' },
    { num: 10, titulo: 'A saída', thumb: 'thumbs/10.png', panda: '' },
    { num: 11, titulo: 'O puerpério', thumb: 'thumbs/11.png', panda: '' }
  ];

  const TOKEN_KEY = 'baby_talks_token';

  function getToken() {
    const params = new URLSearchParams(window.location.search);
    const fromUrl = params.get('t') || params.get('token') || '';
    if (fromUrl) {
      try { localStorage.setItem(TOKEN_KEY, fromUrl); } catch(e) {}
      // remove ?t= da URL pra ficar mais limpa (sem reload)
      const cleanUrl = window.location.origin + window.location.pathname;
      window.history.replaceState({}, '', cleanUrl);
      return fromUrl;
    }
    try { return localStorage.getItem(TOKEN_KEY) || ''; } catch(e) { return ''; }
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso + 'T12:00:00'); // meio-dia pra evitar issues de timezone
    if (isNaN(d)) return '—';
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
  }

  function daysUntil(iso) {
    if (!iso) return null;
    const target = new Date(iso + 'T23:59:59');
    const now = new Date();
    const ms = target.getTime() - now.getTime();
    return Math.ceil(ms / (24 * 60 * 60 * 1000));
  }

  function renderCountdown(expira) {
    const days = daysUntil(expira);
    if (days === null) return;
    const wrap = document.getElementById('countdown');
    const num = document.getElementById('countdownNum');
    const label = document.getElementById('countdownLabel');
    wrap.style.display = 'block';
    if (days <= 0) {
      num.textContent = '0';
      label.textContent = 'expirado';
      wrap.classList.add('urgent');
    } else {
      num.textContent = days;
      label.textContent = days === 1 ? 'dia restante' : 'dias restantes';
      if (days <= 3) wrap.classList.add('urgent');
      else if (days <= 7) wrap.classList.add('warning');
    }
  }

  function renderAulas(aulas) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    aulas.forEach(a => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openAula(a);
      card.innerHTML = `
        <div class="thumb" style="background-image:url('${a.thumb}')">
          <div class="play"></div>
        </div>
        <div class="info">
          <div class="num">Aula ${String(a.num).padStart(2, '0')}</div>
          <div class="title">${a.titulo}</div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function openAula(a) {
    if (!a.panda) {
      // Sem token = sem acesso liberado
      if (confirm('Pra assistir as aulas você precisa responder a pesquisa primeiro.\n\nQuer ir pra pesquisa agora?')) {
        window.location.href = 'https://pesquisa.manualdorecemnascido.com.br/';
      }
      return;
    }
    document.getElementById('player').src = a.panda;
    document.getElementById('modalTitle').textContent = `Aula ${a.num} — ${a.titulo}`;
    document.getElementById('modal').classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('show');
    document.getElementById('player').src = '';
    document.body.style.overflow = '';
  }

  document.getElementById('modal').addEventListener('click', e => {
    if (e.target.id === 'modal') closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  function showError(msg) {
    document.getElementById('splash').innerHTML = `
      <div class="splash-error">
        <h2>Acesso não disponível</h2>
        <p>${msg}</p>
        <a href="https://pesquisa.manualdorecemnascido.com.br" class="btn-link">Responder pesquisa</a>
      </div>
    `;
  }

  function showOffline(motivo, expira) {
    // Limpa o token expirado pra evitar loop
    if (motivo === 'expirado') {
      try { localStorage.removeItem(TOKEN_KEY); } catch(e) {}
    }
    const dataFmt = expira ? fmtDate(expira) : '';
    const ehExpirado = motivo === 'expirado';
    const ehInvalido = motivo === 'nao_encontrado' || motivo === 'sem_token';
    const ehBloqueado = motivo === 'bloqueado';

    let titulo, mensagem, infoLine;
    if (ehExpirado) {
      titulo = 'O curso saiu do ar 💛';
      mensagem = 'O período de acesso ao curso "O Dia do Parto" terminou. Esperamos que ele tenha te preparado pra esse momento tão especial.';
      infoLine = dataFmt ? `Esse acesso foi liberado até ${dataFmt}.` : '';
    } else if (ehBloqueado) {
      titulo = 'Acesso bloqueado';
      mensagem = 'Seu acesso foi suspenso. Entre em contato com a gente para mais informações.';
      infoLine = '';
    } else {
      titulo = 'Link inválido';
      mensagem = 'Esse link de acesso não foi reconhecido. Confira se você está usando o link recebido após responder a pesquisa.';
      infoLine = '';
    }

    document.body.innerHTML = `
      <div class="offline-screen">
        <div class="icon-big">${ehExpirado ? '⏰' : ehBloqueado ? '🔒' : '⚠️'}</div>
        <h1>${titulo}</h1>
        <p>${mensagem}</p>
        ${infoLine ? `<div class="info-line">${infoLine}</div>` : ''}
        <a href="https://pesquisa.manualdorecemnascido.com.br" class="btn-cta">${ehExpirado ? 'Saber mais sobre o evento Baby Talks' : 'Responder pesquisa'}</a>
        <div class="footer-mini">Manual do Recém-nascido · Baby Talks 2026</div>
      </div>
    `;
    document.body.style.background = '#0F0F12';
  }

  async function init() {
    const token = getToken();

    // Sem token = preview da estrutura (mostra cards + redireciona pro form ao clicar)
    if (!token) {
      document.getElementById('expiresAt').textContent = 'após responder a pesquisa';
      renderAulas(MOCK_AULAS);
      document.getElementById('splash').classList.add('hide');
      return;
    }

    try {
      const r = await fetch(`${VALIDATE_URL}?t=${encodeURIComponent(token)}`);
      const data = await r.json();
      if (!data.valido) {
        showOffline(data.motivo, data.expira_em);
        return;
      }
      document.getElementById('expiresAt').textContent = fmtDate(data.expira_em);
      renderCountdown(data.expira_em);
      renderAulas(data.aulas && data.aulas.length ? data.aulas : MOCK_AULAS);
      document.getElementById('splash').classList.add('hide');
    } catch(err) {
      console.error(err);
      // fallback: mostra UI sem dados ao vivo
      document.getElementById('expiresAt').textContent = 'após responder a pesquisa';
      renderAulas(MOCK_AULAS);
      document.getElementById('splash').classList.add('hide');
    }
  }

  init();
</script>
</body>
</html>
